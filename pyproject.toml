[project]
name = "bili-video-insight"
version = "0.3.0"
description = "Bilibili media acquisition and evidence-based video analysis helpers for Codex"
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2025.1.26"]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1.0",
  # faster-whisper 1.2 uses av.open(metadata_errors=...), removed in PyAV 19.
  "av>=11,<19",
  # Newer onnxruntime releases no longer ship Intel macOS wheels.
  "onnxruntime==1.22.1; sys_platform == 'darwin' and platform_machine == 'x86_64'",
]
dev = ["pytest>=8", "ruff>=0.9", "PyYAML>=6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110
